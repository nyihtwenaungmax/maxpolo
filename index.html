<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sun — Knowledge Assistant</title>
<meta name="description" content="Ask questions and get grounded answers from your organization's knowledge base.">
<meta name="theme-color" content="#15140F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15140F;
    --surface: #1E1C16;
    --surface-raised: #262319;
    --line: #37331F;
    --text: #EDE7D9;
    --text-dim: #9C9482;
    --sun: #F2B705;
    --sun-dim: #7A5F0A;
    --user-bubble: #2B2717;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  header{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }

  .mark{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, var(--sun), var(--sun-dim) 75%);
    flex-shrink: 0;
  }

  header h1{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header p{
    margin: 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  main{
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 12px;
  }

  .thread{
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .empty{
    max-width: 460px;
    margin: 12vh auto 0;
    text-align: left;
  }

  .empty h2{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    line-height: 1.25;
    font-weight: 600;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .empty p{
    color: var(--text-dim);
    font-size: 14.5px;
    line-height: 1.6;
    margin: 0 0 22px;
  }

  .chips{
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .chip{
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: var(--radius);
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
  }

  .chip:hover{ border-color: var(--sun-dim); }

  .msg{
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 84%;
  }

  .msg.user{ align-self: flex-end; align-items: flex-end; }
  .msg.bot{ align-self: flex-start; align-items: flex-start; }

  .role{
    font-size: 11px;
    text-transform: none;
    color: var(--text-dim);
    padding: 0 3px;
  }

  .bubble{
    padding: 12px 15px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg.user .bubble{
    background: var(--user-bubble);
    border: 1px solid var(--sun-dim);
    border-top-right-radius: 4px;
  }

  .msg.bot .bubble{
    background: var(--surface);
    border: 1px solid var(--line);
    border-top-left-radius: 4px;
  }

  .thinking .bubble{
    color: var(--text-dim);
    font-style: italic;
  }

  footer{
    flex-shrink: 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  form{
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 6px 6px 6px 16px;
  }

  form:focus-within{ border-color: var(--sun-dim); }

  textarea{
    flex: 1;
    resize: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    padding: 10px 0;
    max-height: 120px;
    outline: none;
  }

  textarea::placeholder{ color: var(--text-dim); }

  button.send{
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--sun);
    color: #1A1608;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button.send:disabled{
    opacity: 0.4;
    cursor: default;
  }

  .disclaimer{
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin: 8px 0 0;
  }

  @media (max-width: 480px){
    .empty{ margin-top: 8vh; }
    .empty h2{ font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="mark" aria-hidden="true"></div>
  <div>
    <h1>Sun</h1>
    <p>Knowledge assistant · POC</p>
  </div>
</header>

<main id="main">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <h2>Ask Sun anything from the knowledge base.</h2>
      <p>Answers are grounded in the documents connected to this assistant, with sources cited where available.</p>
      <div class="chips">
        <button class="chip" type="button" data-q="What documents do you have access to?">What documents do you have access to?</button>
        <button class="chip" type="button" data-q="Summarize the most important policy in the knowledge base.">Summarize the most important policy in the knowledge base.</button>
        <button class="chip" type="button" data-q="What can you help me with?">What can you help me with?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a question…" required></textarea>
    <button class="send" id="sendBtn" type="submit" aria-label="Send">↑</button>
  </form>
  <p class="disclaimer">Sun can make mistakes. Verify important answers against the source document.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
